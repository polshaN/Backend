services:
  # MongoDB - Shared engine, separate databases per service
  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin
      - MONGO_DB_NAME=petdb
    networks:
      - app-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Keycloak - Auth Service
  keycloak:
    build: ./auth-service
    ports:
      - "8091:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=keycloak
      - KC_HOSTNAME=localhost
      - KC_HOSTNAME_PORT=8091
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_ENABLED=true
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - app-net
    volumes:
      - ./auth-service/realm-config:/opt/keycloak/data/import

  # Keycloak Database
  keycloak-db:
    image: postgres:15
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=keycloak
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Gateway
  api-gateway:
    build: ./api-gateway
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - AUTH_SERVICE_URL=http://keycloak:8080
      - KEYCLOAK_REALM=PETADOPTION-APP
      - KEYCLOAK_CLIENT_ID=petadoption-client
      - KEYCLOAK_CLIENT_SECRET=4n9rAdZylGy70jqy99n0epvKKPH09nU1
      - PETADOPTION_BACKEND_URL=http://petadoption-backend:4001
      - PROFILE_SERVICE_URL=http://profile-service:4002
      - CHAT_SERVICE_URL=http://chat-service:4003
    depends_on:
      - keycloak
      - petadoption-backend
      - chat-service
    networks:
      - app-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      disable: true

    # Pet Service
  petadoption-backend:
    build: ./petadoption-backend
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
      - MONGO_URL=mongodb://admin:admin@mongo:27017/petdb?authSource=admin
      - JWT_ISSUER=http://keycloak:8080
      - KEYCLOAK_REALM=PETADOPTION-APP
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app-net

  # Profile Service
  profile-service:
    build: ./profile-service
    ports:
      - "4002:4002"
    environment:
      - PORT=4002
      - MONGO_URL=mongodb://admin:admin@mongo:27017/profiledb?authSource=admin
      - JWT_ISSUER=http://keycloak:8080
      - KEYCLOAK_REALM=PETADOPTION-APP
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app-net

  # Chat Service
  chat-service:
    build: ./chat-service
    ports:
      - "4003:4003"
    environment:
      - PORT=4003
      - MONGO_URL=mongodb://admin:admin@mongo:27017/chatdb?authSource=admin
      - JWT_ISSUER=http://keycloak:8080
      - KEYCLOAK_REALM=PETADOPTION-APP
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app-net

  frontend:
    build:
      context: ./frontend
#    container_name: petadoption-frontend
    ports:
      - "8080:80"
    depends_on:
      api-gateway:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - app-net


volumes:
  mongo-data:
  keycloak-db-data:

networks:
  app-net: